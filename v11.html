<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>High Growth Leader™ V11</title>
<meta name="description" content="High Growth Leader™ V11 — adaptive leadership development, evidence governance and facilitator-ready cohort management.">
<style>
:root{--bg:#050b14;--panel:#0b1626;--panel2:#102239;--text:#f4f8ff;--muted:#9eb1c8;--line:#213650;--accent:#7dd3fc;--accent2:#c4b5fd;--good:#86efac;--warn:#fcd34d;--bad:#fca5a5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1d3857 0,#07111f 42%,#040810 100%);color:var(--text);font:15px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit}
.app{max-width:1240px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:900;letter-spacing:.08em}.badge,.tag{font-size:11px;color:var(--accent);border:1px solid #31516e;border-radius:99px;padding:6px 10px;display:inline-block}.hero{padding:62px 0 32px;max-width:1000px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px}.hero h1{font-size:clamp(46px,7vw,88px);line-height:.94;margin:14px 0}.hero h2{font-size:clamp(34px,5vw,58px);line-height:1;margin:8px 0}.hero p{font-size:19px;color:var(--muted);max-width:800px;line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--accent);color:#06111c;font-weight:900;cursor:pointer}.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:#102239;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:linear-gradient(180deg,#102139,#091523);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 12px 35px #0002}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.shell{display:grid;grid-template-columns:225px 1fr;gap:18px;margin-top:24px}.side{background:#081321;border:1px solid var(--line);border-radius:18px;padding:14px;height:max-content;position:sticky;top:14px}.nav{padding:11px 12px;border-radius:10px;color:var(--muted);margin:3px 0;cursor:pointer}.nav.active,.nav:hover{background:#132b43;color:#fff}.content{min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi b{display:block;font-size:28px;margin:8px 0 2px}.progress{height:8px;background:#15263a;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.barrow{display:grid;grid-template-columns:145px 1fr 45px;gap:10px;align-items:center;margin:14px 0}.question{padding:20px;border:1px solid var(--line);border-radius:16px;margin:12px 0;background:#0a1728}.option{display:block;width:100%;text-align:left;background:#0e2034;border:1px solid #25405c;color:var(--text);padding:14px;border-radius:12px;margin:8px 0;cursor:pointer}.option:hover,.option.sel{border-color:var(--accent);background:#12304a}.notice{border-left:3px solid var(--accent);padding:14px 16px;background:#0c1b2d;border-radius:0 12px 12px 0}.notice.good{border-color:var(--good)}.notice.warn{border-color:var(--warn)}.list{display:grid;gap:0}.listrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.metric{font-size:38px;font-weight:900}.score{display:grid;place-items:center;min-height:210px;background:radial-gradient(circle,#183653,#0b1728 60%,#09111d);border:1px solid var(--line);border-radius:22px}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:20px 0}.step{padding:11px;border:1px solid var(--line);border-radius:12px;text-align:center;font-size:12px;color:var(--muted)}.step.on{border-color:var(--accent);color:#fff;background:#102941}input,textarea,select{width:100%;background:#07111f;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}textarea{min-height:120px;resize:vertical}.choicegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{padding:14px;border:1px solid var(--line);border-radius:13px;background:#0b1a2b;cursor:pointer}.choice.sel{border-color:var(--accent);background:#12304a}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.footer{padding:45px 0 20px;color:var(--muted);font-size:12px;text-align:center}.toast{position:fixed;right:18px;bottom:18px;background:#11263d;border:1px solid #31516e;padding:13px 16px;border-radius:12px;box-shadow:0 15px 50px #0008;z-index:5}.heroSplit{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}
@media(max-width:900px){.shell,.heroSplit{grid-template-columns:1fr}.side{position:static}.grid,.kpis{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.app{padding:16px}.hero{padding-top:38px}.grid,.grid2,.kpis,.choicegrid{grid-template-columns:1fr}.timeline{grid-template-columns:1fr 1fr}.barrow{grid-template-columns:105px 1fr 35px}}
</style>
</head>
<body><div class="app">
<div class="top"><div class="brand">HIGH GROWTH LEADER™</div><div class="badge">V11 • PRODUCT ARCHITECTURE</div></div>
<div id="app"></div>
<div class="footer">V11 validation prototype • Local browser persistence only • No learner data is transmitted</div>
</div>
<script>
const KEY='hgl_v11_learner';
const qs=[
['Dependency','When a critical business decision appears, who usually has to be involved?',['Me personally','Me plus a capable colleague','A defined owner using clear decision rights','The system/process resolves most cases']],
['Ownership','How confidently can your team make important decisions without you?',['Low confidence','Some confidence','High confidence','Very high — ownership is explicit']],
['Systems','How repeatable are your critical workflows?',['Mostly in my head','Some documented processes','Standardised and measured','Systemised, automated and governed']],
['Transfer','How is your expertise transferred to the next generation of leaders?',['Mostly through me','Coaching and informal documents','Structured playbooks and coaching','AI-enabled knowledge system with human review']],
['Scale','What is the biggest constraint on your next stage of growth?',['My capacity','Team capability','Operational consistency','Strategic scale and leverage']],
['Continuity','If you disappeared for 30 days, what would most likely happen?',['Performance would fall quickly','Some decisions would stall','The team would continue with minor friction','The business would largely operate normally']]
];
const modules=[['01','From Performer to Multiplier'],['02','The Dependency Trap'],['03','See Potential Before Performance'],['04','Coach the Next Generation'],['05','Extract Your Expertise'],['06','Build a Team That Doesn’t Need You'],['07','Become an AI-Powered Leader'],['08','AI-Powered Knowledge Transfer'],['09','Lead Beyond Your Organisation'],['10','Build the Next Generation in Public'],['11','Leadership Operating System'],['12','Step-Away Challenge™']];
const defaults={screen:'landing',q:0,answers:[],route:null,index:0,outcome:'',metric:'',modules:[],evidence:[],challenge:{status:'not_started',owner:'',responsibility:'',baseline:'',result:''},demo:{status:'not_submitted',score:null},profile:{name:'',role:'',company:''}};
let state=load();
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function reset(){if(confirm('Reset this prototype learner record?')){localStorage.removeItem(KEY);state={...defaults};render()}}
function scores(){let s={Dependency:0,Ownership:0,Systems:0,Transfer:0,Scale:0,Continuity:0};state.answers.forEach((a,i)=>s[qs[i][0]]=a+1);return s}
function route(){let s=scores();if((s.Systems>=3&&s.Transfer>=3)||(s.Continuity<=2&&s.Dependency<=2))return ['System Builder','Build a business that performs without constant founder intervention.',['Dependency Mapping','Expertise Extraction','Ownership Transfer','AI Knowledge Transfer','Leadership OS','Step-Away Challenge']];if(s.Ownership<=2||s.Dependency<=2)return ['Multiplier Leader','Turn leadership capability into scalable team performance.',['Delegation','Coaching','Decision Rights','Standards','Leadership Multiplication','Scale']];return ['Strategic Leader','Move from operational leadership into enterprise-level leverage.',['Strategic Focus','Portfolio Thinking','Influence','Leadership Multiplication','Scale','Continuity']]}
function indexScore(){let v=Object.values(scores());return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*20):0}
function toast(m){let x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function header(a,b){return '<div class="hero" style="padding-bottom:10px"><div class="eyebrow">'+a+'</div><h2>'+b+'</h2></div>'}
function nav(){return '<aside class="side"><div class="brand" style="margin:8px 0 16px">MY SYSTEM</div>'+[['dashboard','Dashboard'],['assessment','Reassess'],['academy','Academy'],['evidence','Evidence'],['challenge','Step-Away'],['demo','Demo Day'],['certify','Certification']].map(x=>'<div class="nav '+(state.screen===x[0]?'active':'')+'" onclick="show(\''+x[0]+'\')">'+x[1]+'</div>').join('')+'<div class="nav" onclick="show(\'profile\')">Profile & Goals</div><div class="nav" onclick="show(\'review\')">Reviewer View</div><div class="nav" onclick="show(\'commercial\')">Commercial Model</div></aside>'}
function render(){
const r=document.getElementById('app');let h='';
if(state.screen==='landing')h='<section class="heroSplit"><section class="hero"><div class="eyebrow">Adaptive leadership development platform</div><h1>Stop being the bottleneck. Become the multiplier.</h1><p>V11 connects diagnosis, personalised learning, business evidence and facilitator review into one leadership development system.</p><div class="actions"><button class="btn" onclick="start()">Build my leadership profile →</button><button class="btn secondary" onclick="show(\'review\')">Preview reviewer experience</button></div><div style="margin-top:24px"><span class="tag">Adaptive diagnosis</span> <span class="tag">Evidence governance</span> <span class="tag">Facilitator-ready</span> <span class="tag">Demo Day certified</span></div></section><div class="score"><div style="text-align:center"><div class="eyebrow">V11 operating model</div><div class="metric">Diagnose<br>→ Build<br>→ Prove</div><p class="muted">The product measures transfer, not attendance.</p></div></div></section><div class="grid"><div class="card"><div class="eyebrow">01</div><h3>Diagnose</h3><p class="muted">Six dimensions create a baseline for leadership leverage.</p></div><div class="card"><div class="eyebrow">02</div><h3>Personalise</h3><p class="muted">The system chooses depth and sequence based on the assessed constraint.</p></div><div class="card"><div class="eyebrow">03</div><h3>Govern evidence</h3><p class="muted">Evidence gates, facilitator review and Demo Day turn learning into proof.</p></div></div><div class="card" style="margin-top:14px"><div class="grid2"><div><h3>What changed in V11?</h3><p class="muted">Learner state persists locally, diagnostic dimensions are structured data, evidence has status, the Step-Away Challenge has a workflow, and a facilitator-ready review layer is built into the product model.</p></div><div><h3>Ready for the next technical stage</h3><p class="muted">The prototype is deliberately backend-free. A production build can replace local storage with authentication, database records, file storage, payments and analytics without redesigning the learner journey.</p></div></div></div>';
else if(state.screen==='assessment'){let q=qs[state.q];h=header('High Growth Leadership Index™','Question '+(state.q+1)+' of '+qs.length)+'<div class="card"><div class="progress"><span style="width:'+(state.q/qs.length*100)+'%"></span></div><div class="question"><div class="tag">'+q[0]+'</div><h3 style="font-size:24px;margin-top:12px">'+q[1]+'</h3>'+q[2].map((x,i)=>'<button class="option '+(state.answers[state.q]===i?'sel':'')+'" onclick="answer('+i+')">'+x+'</button>').join('')+'</div></div><p class="muted small">Your baseline is stored locally in this browser so you can leave and return during the prototype test.</p>';
else if(state.screen==='diagnosis'){let rt=route();state.route=rt;state.index=indexScore();save();h=header('Diagnosis complete','Your adaptive route is '+rt[0]+'.')+'<div class="heroSplit"><div><div class="notice good"><b>'+rt[0]+' pathway recommended.</b><br><span class="muted">'+rt[1]+'</span></div><div class="card" style="margin-top:14px"><h3>Why the system selected this route</h3>'+Object.entries(scores()).map(([k,v])=>'<div class="barrow"><span>'+k+'</span><div class="progress"><span style="width:'+v/4*100+'%"></span></div><b>'+v+'/4</b></div>').join('')+'</div></div><div class="score"><div style="text-align:center"><div class="eyebrow">Leadership Index™</div><div class="metric">'+state.index+'</div><span class="muted">/100 baseline</span></div></div></div><div class="actions"><button class="btn" onclick="show(\'profile\')">Set my outcome →</button><button class="btn secondary" onclick="show(\'dashboard\')">View dashboard</button></div>';
else if(state.screen==='profile')h=header('Profile & Goals','Connect the programme to a measurable business outcome.')+'<div class="grid2"><div class="card"><h3>Learner profile</h3><input id="pname" placeholder="Name" value="'+esc(state.profile.name)+'" style="margin-bottom:9px"><input id="prole" placeholder="Role" value="'+esc(state.profile.role)+'" style="margin-bottom:9px"><input id="pcompany" placeholder="Company / organisation" value="'+esc(state.profile.company)+'"></div><div class="card"><h3>Primary growth outcome</h3><div class="choicegrid">'+['Reduce founder dependency','Build stronger leaders','Systemise operations','Scale strategically'].map(x=>'<div class="choice '+(state.outcome===x?'sel':'')+'" onclick="pickOutcome(\''+x+'\',this)">'+x+'</div>').join('')+'</div><p class="muted" style="margin-top:16px">Success metric</p><input id="pmetric" placeholder="e.g. reduce my operational involvement by 30%" value="'+esc(state.metric)+'"><div class="actions"><button class="btn" onclick="saveProfile()">Save profile & open dashboard →</button></div></div></div>';
else if(state.screen==='dashboard')h=dashboard();
else if(state.screen==='academy')h=academy();
else if(state.screen==='module')h=module();
else if(state.screen==='evidence')h=evidence();
else if(state.screen==='challenge')h=challenge();
else if(state.screen==='demo')h=demo();
else if(state.screen==='certify')h=certify();
else if(state.screen==='review')h=review();
else if(state.screen==='commercial')h=commercial();
r.innerHTML=h}
function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function dashboard(){let sc=scores(),rt=state.route||route(),idx=state.index||indexScore(),done=state.modules.length;return '<div class="shell">'+nav()+'<main class="content"><div class="eyebrow">Personalised learner workspace</div><h2 style="font-size:42px;margin:8px 0">'+rt[0]+' pathway</h2><p class="muted">Outcome: '+esc(state.outcome||'Not set')+' · Target: '+esc(state.metric||'Not set')+'</p><div class="kpis"><div class="card kpi">Leadership Index<b>'+idx+'/100</b><span class="muted">Baseline</span></div><div class="card kpi">Evidence<b>'+state.evidence.length+'</b><span class="muted">Captured</span></div><div class="card kpi">Modules<b>'+done+'/12</b><span class="muted">Completed</span></div><div class="card kpi">Demo Day<b>'+state.demo.status.replace('_',' ')+'</b><span class="muted">Certification gate</span></div></div><div class="grid2" style="margin-top:14px"><div class="card"><div class="eyebrow">Next Best Action™</div><h3>Transfer one recurring decision</h3><p class="muted">Name the owner, define the decision boundary and test the transfer for seven days.</p><button class="btn" onclick="show(\'academy\')">Open academy →</button></div><div class="card"><div class="eyebrow">System health</div><h3>Evidence-led progress</h3><div class="progress"><span style="width:'+Math.min(100,(state.evidence.length/6)*100)+'%"></span></div><p class="muted">'+state.evidence.length+' of 6 core evidence gates represented in the prototype.</p></div></div><div class="card" style="margin-top:14px"><h3>Diagnostic profile</h3>'+Object.entries(sc).map(([k,v])=>'<div class="barrow"><span>'+k+'</span><div class="progress"><span style="width:'+v/4*100+'%"></span></div><b>'+v+'/4</b></div>').join('')+'</div></main></div>'}
function academy(){let rt=state.route||route();return '<div class="shell">'+nav()+'<main class="content">'+header('Academy','A pathway, not a content library.')+'<div class="notice"><b>'+rt[0]+' depth is active.</b> Evidence gates unlock progression and can trigger reassessment.</div><div class="grid" style="margin-top:14px">'+modules.map((m,i)=>{let active=i<3||i<=state.modules.length+2;return '<div class="card" style="opacity:'+(active?1:.6)+'"><div class="eyebrow">'+m[0]+' • '+(state.modules.includes(i)?'COMPLETE':active?'ACTIVE':'LOCKED')+'</div><h3>'+m[1]+'</h3><p class="muted">Live-business lesson, build task, transfer experiment and evidence gate.</p><button class="btn '+(active?'':'ghost')+'" onclick="openModule('+i+')">'+(state.modules.includes(i)?'Review evidence':active?'Open module':'Locked')+'</button></div>'}).join('')+'</div></main></div>'}
function module(){let i=state.module||0,m=modules[i];return '<div class="shell">'+nav()+'<main class="content">'+header('Module '+m[0],m[1])+'<div class="timeline"><div class="step on">Learn</div><div class="step on">Build</div><div class="step on">Transfer</div><div class="step">Prove</div><div class="step">Certify</div><div class="step">Reassess</div></div><div class="grid2"><div class="card"><h3>Build task</h3><p class="muted">Apply this module to one live leadership constraint. Capture the trigger, decision rule, owner, exceptions and review point.</p><textarea id="note" placeholder="What did you build or change?"></textarea></div><div class="card"><h3>Evidence gate</h3><p class="muted">A reviewer should be able to verify the baseline, intervention, measurable change and your reflection.</p><select id="etype"><option>Business artefact</option><option>Behaviour change</option><option>Team outcome</option><option>System / workflow</option></select><input id="impact" style="margin-top:9px" placeholder="Measured impact (e.g. decision time reduced 25%)"></div></div><div class="card" style="margin-top:14px"><h3>Submit evidence</h3><div class="notice warn">Prototype governance: evidence is marked <b>Submitted</b> locally. Production V12 can route it to a facilitator for approve / revise / reject.</div><div class="actions"><button class="btn" onclick="submitEvidence()">Submit evidence →</button><button class="btn secondary" onclick="show(\'academy\')">Back to academy</button></div></div></main></div>'}
function evidence(){return '<div class="shell">'+nav()+'<main class="content">'+header('Evidence Portfolio','A governed record of leadership transfer.')+'<div class="grid">'+[['Dependency Map','Baseline dependency identified.'],['Expertise-to-System Pack','Critical judgement converted into reusable knowledge.'],['Ownership Matrix','Decision rights and escalation boundaries assigned.'],['AI Workflow Card','AI workflow designed with human review.'],['Step-Away Results','30-day continuity evidence.'],['Demo Day','Facilitated proof of transfer.']].map((x,i)=>{let e=state.evidence[i];return '<div class="card"><div class="tag">'+(e?'SUBMITTED':'PENDING')+'</div><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p>'+(e?'<p class="small">Impact: '+esc(e.impact||'Not recorded')+'</p>':'')+'</div>'}).join('')+'</div><div class="card" style="margin-top:14px"><h3>Governance model</h3><p class="muted">V11 separates learner submission from facilitator approval. This prevents the product from equating “uploaded” with “proven”.</p></div></main></div>'}
function challenge(){let c=state.challenge;return '<div class="shell">'+nav()+'<main class="content">'+header('Step-Away Challenge™','Prove the organisation can operate with less dependence on you.')+'<div class="grid2"><div class="card"><h3>30-day experiment</h3><p class="muted">Transfer one responsibility, establish the operating boundary, step back and measure continuity.</p><input id="resp" placeholder="Responsibility to transfer" value="'+esc(c.responsibility)+'" style="margin-bottom:9px"><input id="owner" placeholder="Named owner" value="'+esc(c.owner)+'" style="margin-bottom:9px"><input id="base" placeholder="Baseline metric" value="'+esc(c.baseline)+'" style="margin-bottom:9px"><textarea id="result" placeholder="Result / exceptions / learning">'+esc(c.result)+'</textarea><button class="btn" onclick="saveChallenge()">Save challenge plan →</button></div><div class="card"><h3>Challenge status</h3><div class="list"><div class="listrow"><span>Responsibility</span><span class="tag">'+(c.responsibility?'READY':'PENDING')+'</span></div><div class="listrow"><span>Owner</span><span class="tag">'+(c.owner?'READY':'PENDING')+'</span></div><div class="listrow"><span>Baseline</span><span class="tag">'+(c.baseline?'READY':'PENDING')+'</span></div><div class="listrow"><span>30-day result</span><span class="tag">'+(c.result?'SUBMITTED':'PENDING')+'</span></div></div><div class="notice" style="margin-top:14px"><b>Production governance:</b> facilitator verifies evidence before certification.</div></div></div></main></div>'}
function demo(){return '<div class="shell">'+nav()+'<main class="content">'+header('In-house Demo Day','A proof event, not a graduation ceremony.')+'<div class="card"><h3>Assessment rubric</h3>'+[['Dependency reduced',25],['Ownership transferred',20],['Knowledge system',20],['Standards & decisions',15],['Continuity evidence',20]].map(x=>'<div class="barrow"><span>'+x[0]+'</span><div class="progress"><span style="width:'+x[1]+'%"></span></div><b>'+x[1]+'%</b></div>').join('')+'</div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Learner submission</h3><p class="muted">Present baseline → intervention → evidence → business impact → what happens without you.</p><button class="btn" onclick="submitDemo()">Submit Demo Day pack →</button></div><div class="card"><h3>Facilitator decision</h3><p class="muted">Production state machine: Submitted → In Review → Approved / Revise → Certified.</p><div class="tag">'+state.demo.status.replaceAll('_',' ')+'</div></div></div></main></div>'}
function certify(){let ready=state.evidence.length>=3&&state.demo.status==='approved';return '<div class="shell">'+nav()+'<main class="content">'+header('Certification','High Growth Leader™ — '+(state.route?state.route[0]:'Adaptive Leader'))+'<div class="heroSplit"><div class="card"><div class="tag">'+(ready?'CERTIFICATION READY':'PROOF GATES OPEN')+'</div><h2 style="margin-top:12px">'+(state.route?state.route[0]:'Pathway')+'</h2><p class="muted">Certification requires assessed pathway completion, governed evidence, Step-Away results and an approved Demo Day.</p><div class="list"><div class="listrow"><span>Assessment</span><span>✓</span></div><div class="listrow"><span>Evidence</span><span>'+(state.evidence.length>=3?'✓':'○')+'</span></div><div class="listrow"><span>Step-Away</span><span>'+(state.challenge.result?'✓':'○')+'</span></div><div class="listrow"><span>Demo Day approval</span><span>'+(state.demo.status==='approved'?'✓':'○')+'</span></div></div></div><div class="score"><div style="text-align:center"><div class="eyebrow">Next milestone</div><div class="metric">'+(ready?'CERTIFIED':'PROVE')+'</div></div></div></div><div class="actions"><button class="btn" onclick="show(\'challenge\')">Continue proof →</button><button class="btn secondary" onclick="exportRecord()">Export learner record</button></div></main></div>'}
function review(){return header('Reviewer Experience','Challenge V11 like a serious buyer, facilitator or investor.')+'<div class="grid">'+[['01','Problem','Does the product solve a painful leadership-growth problem?'],['02','Diagnosis','Does the assessment create enough signal to justify personalisation?'],['03','Adaptive route','Does System Builder feel materially different from a normal leadership course?'],['04','Evidence governance','Would you trust the distinction between submitted and approved evidence?'],['05','Facilitation','Could a facilitator manage a cohort without spreadsheets?'],['06','Commercial','Is the value proposition strong enough for £1.5k / £7.5k / enterprise?']].map(x=>'<div class="card"><div class="eyebrow">'+x[0]+' • '+x[1]+'</div><h3>'+x[2]+'</h3><textarea placeholder="Your challenge / criticism"></textarea></div>').join('')+'</div><div class="actions"><button class="btn" onclick="show(\'commercial\')">View commercial model →</button></div>'}
function commercial(){return header('Commercial model','Three buyer motions, one underlying system.')+'<div class="grid"><div class="card"><div class="eyebrow">Individual</div><h3>Leadership Accelerator</h3><div class="metric">£1,500</div><p class="muted">Assessment, adaptive pathway, academy, evidence and certification.</p><button class="btn" onclick="toast(\'Prototype CTA — no payment processed\')">Join validation cohort</button></div><div class="card"><div class="eyebrow">Team</div><h3>Leadership Cohort</h3><div class="metric">£7,500</div><p class="muted">Up to 10 leaders, facilitator review, cohort reporting and Demo Day.</p><button class="btn" onclick="toast(\'Prototype CTA — cohort brief requested\')">Request cohort brief</button></div><div class="card"><div class="eyebrow">Enterprise</div><h3>Leadership System</h3><div class="metric">Custom</div><p class="muted">Organisation-wide diagnostics, governance, pathways and leadership pipeline reporting.</p><button class="btn" onclick="toast(\'Prototype CTA — enterprise conversation\')">Start conversation</button></div></div><div class="card" style="margin-top:14px"><h3>V12 production boundary</h3><p class="muted">Authentication • database • secure evidence storage • payments • email • analytics • facilitator permissions • audit trail • certificate issuance.</p></div>'}
function start(){state.screen='assessment';state.q=0;state.answers=[];state.route=null;state.index=0;save();render()}
function answer(i){state.answers[state.q]=i;if(state.q<qs.length-1){state.q++;save();render()}else{state.route=route();state.index=indexScore();save();state.screen='diagnosis';render()}}
function show(s){state.screen=s;save();render()}
function pickOutcome(x,el){document.querySelectorAll('.choice').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');state.outcome=x}
function saveProfile(){state.profile={name:document.getElementById('pname').value,role:document.getElementById('prole').value,company:document.getElementById('pcompany').value};state.metric=document.getElementById('pmetric').value;save();show('dashboard')}
function openModule(i){if(i>state.modules.length+2){toast('Complete earlier evidence gates to unlock this module');return}state.module=i;state.screen='module';render()}
function submitEvidence(){let i=state.module||0;let e={module:i,type:document.getElementById('etype').value,impact:document.getElementById('impact').value,note:document.getElementById('note').value,status:'submitted',at:new Date().toISOString()};state.evidence[i%6]=e;if(!state.modules.includes(i))state.modules.push(i);save();toast('Evidence submitted locally');show('evidence')}
function saveChallenge(){state.challenge={status:'submitted',responsibility:document.getElementById('resp').value,owner:document.getElementById('owner').value,baseline:document.getElementById('base').value,result:document.getElementById('result').value};save();toast('Challenge plan saved');render()}
function submitDemo(){state.demo={status:'submitted',score:null};save();toast('Demo Day pack submitted for facilitator review');render()}
function exportRecord(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='high-growth-leader-v11-learner-record.json';a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
