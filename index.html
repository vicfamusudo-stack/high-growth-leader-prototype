<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>High Growth Leader™ V9</title><meta name="description" content="High Growth Leader™ — an adaptive leadership development system for leaders building scalable businesses."><style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#11243b;--text:#eef5ff;--muted:#9db0c8;--line:#203650;--accent:#7dd3fc;--good:#86efac;--warn:#fcd34d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17304d 0,#07111f 42%,#050b14 100%);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit}.app{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;letter-spacing:.04em}.badge{font-size:12px;color:var(--accent);border:1px solid #31516e;border-radius:99px;padding:7px 11px}.hero{padding:60px 0 30px;max-width:900px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.95;margin:14px 0}.hero p{font-size:19px;color:var(--muted);max-width:720px;line-height:1.6}.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--accent);color:#06111c;font-weight:800;cursor:pointer}.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:linear-gradient(180deg,#102139,#0b1728);border:1px solid var(--line);border-radius:18px;padding:20px}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:24px}.side{background:#091626;border:1px solid var(--line);border-radius:18px;padding:14px;height:max-content;position:sticky;top:14px}.nav{padding:11px 12px;border-radius:10px;color:var(--muted);margin:3px 0}.nav.active{background:#132b43;color:#fff}.content{min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi b{display:block;font-size:28px;margin-top:8px}.progress{height:8px;background:#15263a;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.barrow{display:grid;grid-template-columns:140px 1fr 42px;gap:10px;align-items:center;margin:14px 0}.question{padding:20px;border:1px solid var(--line);border-radius:16px;margin:12px 0;background:#0a1728}.option{display:block;width:100%;text-align:left;background:#0e2034;border:1px solid #25405c;color:var(--text);padding:14px;border-radius:12px;margin:8px 0;cursor:pointer}.option:hover,.option.sel{border-color:var(--accent);background:#12304a}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#12304a;color:var(--accent);font-size:12px;margin:4px}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.step{padding:12px;border:1px solid var(--line);border-radius:12px;text-align:center;font-size:12px;color:var(--muted)}.step.on{border-color:var(--accent);color:#fff;background:#102941}.notice{border-left:3px solid var(--accent);padding:14px 16px;background:#0c1b2d;border-radius:0 12px 12px 0}.hidden{display:none}.footer{padding:40px 0;color:var(--muted);font-size:12px;text-align:center}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:static}.grid,.kpis{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:1fr 1fr}}@media(max-width:560px){.app{padding:18px}.grid,.kpis{grid-template-columns:1fr}.hero{padding-top:35px}}
</style></head><body><div class="app"><div class="top"><div class="brand">HIGH GROWTH LEADER™</div><div class="badge">V9 • ADAPTIVE LEADERSHIP SYSTEM</div></div><div id="app"></div><div class="footer">V9 validation prototype • No personal learner data is stored or transmitted</div></div><script>
const state={screen:'welcome',q:0,answers:[],route:null,startedAt:null};
const qs=[['When the business hits a bottleneck, what usually happens?',['I personally solve it','A capable person solves it with some guidance','The process/system solves most of it','It depends on the situation']],['How dependent is the business on your personal expertise?',['Very dependent','Moderately dependent','Low dependency','I am not sure']],['If you stepped away for 30 days, what would happen?',['Performance would drop quickly','Some decisions would stall','The team would largely continue','We already operate this way']],['Where is your biggest growth constraint?',['My leadership capacity','Team ownership','Repeatable systems','Strategic scale']],['How are critical decisions and knowledge currently transferred?',['Mostly through me','Informally through people','Documented and repeatable','AI-enabled with human review']]];
function route(){let a=state.answers;let dep=(a[1]||0)+(a[2]||0),sys=(a[2]||0)+(a[3]||0)+(a[4]||0); if(sys>=7||dep<=2)return ['System Builder','Build a business that can perform without constant founder intervention.','Dependency Mapping → Expertise Extraction → Ownership Transfer → AI Knowledge Transfer → Leadership OS']; if((a[0]||0)<=1)return ['Multiplier Leader','Turn personal leadership strength into scalable team performance.','Delegation → Coaching → Standards → Decision Rights → Scale']; return ['Strategic Leader','Move from operational leadership into enterprise-level leverage.','Strategic Focus → Portfolio Thinking → Leadership Multiplication → Influence → Scale'];}
function header(title,sub){return `<div class="hero" style="padding-bottom:10px"><div class="eyebrow">${title}</div><h2 style="font-size:40px;margin:8px 0">${sub}</h2></div>`}
function render(){const root=document.getElementById('app');let h='';if(state.screen==='welcome'){h=`<section class="hero"><div class="eyebrow">The leadership system for the next stage of growth</div><h1>Build a business that doesn't need you every day.</h1><p>High Growth Leader™ is not a library of leadership lessons. It diagnoses how you currently lead, identifies the constraint limiting growth, and builds a personalised route around the highest-leverage capability.</p><div class="actions"><button class="btn" onclick="start()">Start the Leadership Assessment →</button><button class="btn secondary" onclick="review()">Preview Reviewer Experience</button></div></section><div class="grid"><div class="card"><h3>01 Diagnose</h3><p class="muted">Measure leadership leverage, dependency, systems, ownership and scale readiness.</p></div><div class="card"><h3>02 Personalise</h3><p class="muted">Route each leader into the pathway that matches their business model and constraint.</p></div><div class="card"><h3>03 Prove</h3><p class="muted">Create evidence, complete a Step-Away Challenge and demonstrate transfer at Demo Day.</p></div></div>`}else if(state.screen==='assessment'){let q=qs[state.q];h=header('Leadership Assessment',`Question ${state.q+1} of ${qs.length}`)+`<div class="card"><div class="progress"><span style="width:${((state.q)/qs.length)*100}%"></span></div><div class="question"><h3>${q[0]}</h3>${q[1].map((x,i)=>`<button class="option ${state.answers[state.q]===i?'sel':''}" onclick="answer(${i})">${x}</button>`).join('')}</div></div>`}else if(state.screen==='diagnosis'){let r=route();state.route=r;h=header('Your diagnosis',`Your highest-leverage pathway is ${r[0]}`)+`<div class="notice"><b>${r[1]}</b><br><span class="muted">The system has selected this route because of the dependency, systems and transfer signals in your assessment.</span></div><div class="card" style="margin-top:16px"><h3>Adaptive pathway generated</h3><p>${r[2]}</p><span class="tag">Personalised sequence</span><span class="tag">Evidence-led</span><span class="tag">Business-model aware</span></div><div class="actions"><button class="btn" onclick="dashboard()">Enter My Leadership System →</button></div>`}else if(state.screen==='dashboard'){h=`<div class="shell"><aside class="side"><div class="brand" style="margin:8px 0 16px">MY SYSTEM</div><div class="nav active">Dashboard</div><div class="nav">Leadership Index</div><div class="nav">My Path</div><div class="nav">Academy</div><div class="nav">Evidence Portfolio</div><div class="nav">Step-Away Challenge</div><div class="nav">Demo Day</div><div class="nav">Certification</div></aside><main class="content"><div class="eyebrow">Personalised dashboard</div><h2 style="font-size:40px;margin:8px 0">${state.route[0]} pathway</h2><p class="muted">Your programme changes with your diagnosis — depth, sequence, activities and proof are all adapted.</p><div class="kpis"><div class="card kpi">Leadership Index<b>3.6/5</b><span class="muted">Multiplier</span></div><div class="card kpi">Dependency<b>38%</b><span class="muted">↓ 12 pts target</span></div><div class="card kpi">Ownership<b>2.4/5</b><span class="muted">Priority gap</span></div><div class="card kpi">Step-Away<b>44%</b><span class="muted">Current readiness</span></div></div><div class="card" style="margin-top:14px"><h3>Next Best Action</h3><p>Transfer one recurring decision to a named owner, define the decision boundary and test it for seven days.</p><button class="btn" onclick="lesson()">Continue to Current Lesson →</button></div><div class="card" style="margin-top:14px"><h3>Why this route?</h3><div class="barrow"><span>Clarity</span><div class="progress"><span style="width:82%"></span></div><b>4.1</b></div><div class="barrow"><span>Systems</span><div class="progress"><span style="width:42%"></span></div><b>2.1</b></div><div class="barrow"><span>Ownership</span><div class="progress"><span style="width:40%"></span></div><b>2.0</b></div><div class="barrow"><span>Scale</span><div class="progress"><span style="width:48%"></span></div><b>2.4</b></div></div></main></div>`}else if(state.screen==='lesson'){h=header('Academy • Module 05',`Extract Your Expertise`)+`<div class="timeline"><div class="step on">Learn</div><div class="step on">Build</div><div class="step">Transfer</div><div class="step">Prove</div><div class="step">Certify</div></div><div class="grid"><div class="card"><h3>Why this matters</h3><p class="muted">If the organisation needs you to explain the same critical decisions repeatedly, expertise is trapped in a person rather than embedded in the system.</p></div><div class="card"><h3>Your build task</h3><p class="muted">Capture one high-value recurring judgement: trigger, inputs, decision rule, exceptions, owner and review point.</p></div><div class="card"><h3>AI-assisted transfer</h3><p class="muted">Turn the captured expertise into an AI workflow with explicit human review and escalation boundaries.</p></div></div><div class="card" style="margin-top:14px"><h3>Evidence you will create</h3><p>Expertise-to-System Pack + AI Workflow Card + human-review rule.</p><button class="btn" onclick="evidence()">Add Evidence →</button></div>`}else if(state.screen==='evidence'){h=header('Evidence Portfolio','Proof, not attendance.')+`<div class="grid"><div class="card"><h3>✓ Dependency Map</h3><p class="muted">Critical dependency identified and baseline recorded.</p></div><div class="card"><h3>✓ Expertise-to-System Pack</h3><p class="muted">Decision logic converted into a reusable system.</p></div><div class="card"><h3>✓ Ownership Matrix</h3><p class="muted">Decision rights and escalation boundaries assigned.</p></div><div class="card"><h3>✓ AI Workflow Card</h3><p class="muted">Automation designed with human review.</p></div><div class="card"><h3>○ Step-Away Results</h3><p class="muted">30-day continuity evidence still required.</p></div><div class="card"><h3>○ Demo Day</h3><p class="muted">Live in-house proof of transfer and continuity.</p></div></div><div class="actions"><button class="btn" onclick="challenge()">Start Step-Away Challenge →</button></div>`}else if(state.screen==='challenge'){h=header('Step-Away Challenge™','Can the business perform without you?')+`<div class="card"><h3>30-day challenge</h3><p class="muted">Select one responsibility you currently own. Transfer it, establish the system, step back, measure the outcome and document what changed.</p><div class="notice"><b>Success threshold:</b> measurable dependency reduction + successful ownership transfer + continuity evidence.</div><div class="actions"><button class="btn" onclick="demo()">Mark Challenge Plan Complete →</button></div></div>`}else if(state.screen==='demo'){h=header('In-house Demo Day','Demonstrate the change you created.')+`<div class="card"><h3>Assessment rubric</h3><div class="barrow"><span>Dependency reduced</span><div class="progress"><span style="width:25%"></span></div><b>25%</b></div><div class="barrow"><span>Ownership transferred</span><div class="progress"><span style="width:20%"></span></div><b>20%</b></div><div class="barrow"><span>Knowledge system</span><div class="progress"><span style="width:20%"></span></div><b>20%</b></div><div class="barrow"><span>Standards & decisions</span><div class="progress"><span style="width:15%"></span></div><b>15%</b></div><div class="barrow"><span>Continuity evidence</span><div class="progress"><span style="width:20%"></span></div><b>20%</b></div><button class="btn" onclick="certify()">Preview Certification →</button></div>`}else if(state.screen==='certify'){h=header('Certification','High Growth Leader™ — System Builder')+`<div class="card"><div class="tag">PATHWAY CERTIFIED</div><h2>System Builder</h2><p class="muted">Awarded when the learner demonstrates leadership leverage, knowledge transfer, ownership transfer, AI workflow governance and 30-day continuity evidence.</p><div class="notice"><b>Reassessment:</b> Your next diagnostic refreshes the pathway and identifies the next highest-leverage constraint.</div><div class="actions"><button class="btn" onclick="start()">Reassess My Leadership →</button></div></div>`}root.innerHTML=h}
function start(){state.screen='assessment';state.q=0;state.answers=[];state.route=null;state.startedAt=Date.now();render()}function answer(i){state.answers[state.q]=i;if(state.q<qs.length-1){state.q++;render()}else{state.screen='diagnosis';render()}}function dashboard(){state.screen='dashboard';render()}function lesson(){state.screen='lesson';render()}function evidence(){state.screen='evidence';render()}function challenge(){state.screen='challenge';render()}function demo(){state.screen='demo';render()}function certify(){state.screen='certify';render()}function review(){location.href='feedback.html'}render();
</script></body></html>
