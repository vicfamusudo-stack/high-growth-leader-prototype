<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>High Growth Leader™ V10</title>
<meta name="description" content="High Growth Leader™ V10 — an adaptive leadership development platform that diagnoses the constraint, personalises the pathway and proves leadership leverage.">
<style>
:root{--bg:#050b14;--panel:#0b1626;--panel2:#102239;--text:#f4f8ff;--muted:#9eb1c8;--line:#213650;--accent:#7dd3fc;--accent2:#c4b5fd;--good:#86efac;--warn:#fcd34d;--danger:#fca5a5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 78% -10%,#1d3857 0,#07111f 40%,#040810 100%);color:var(--text);font:15px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit}
.app{max-width:1240px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:6px 0}.brand{font-weight:900;letter-spacing:.08em}.badge,.pill{font-size:11px;color:var(--accent);border:1px solid #31516e;border-radius:99px;padding:7px 11px}.hero{padding:64px 0 34px;max-width:980px}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:11px}.hero h1{font-size:clamp(46px,7vw,88px);line-height:.94;margin:14px 0}.hero h2{font-size:clamp(34px,5vw,58px);line-height:1;margin:8px 0}.hero p{font-size:19px;color:var(--muted);max-width:790px;line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--accent);color:#06111c;font-weight:900;cursor:pointer}.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:#102239;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:linear-gradient(180deg,#102139,#091523);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 12px 35px #0002}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:24px}.side{background:#081321;border:1px solid var(--line);border-radius:18px;padding:14px;height:max-content;position:sticky;top:14px}.nav{padding:11px 12px;border-radius:10px;color:var(--muted);margin:3px 0;cursor:pointer}.nav.active,.nav:hover{background:#132b43;color:#fff}.content{min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi b{display:block;font-size:28px;margin:8px 0 2px}.progress{height:8px;background:#15263a;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.barrow{display:grid;grid-template-columns:150px 1fr 45px;gap:10px;align-items:center;margin:14px 0}.question{padding:20px;border:1px solid var(--line);border-radius:16px;margin:12px 0;background:#0a1728}.option{display:block;width:100%;text-align:left;background:#0e2034;border:1px solid #25405c;color:var(--text);padding:14px;border-radius:12px;margin:8px 0;cursor:pointer}.option:hover,.option.sel{border-color:var(--accent);background:#12304a}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#12304a;color:var(--accent);font-size:12px;margin:4px}.notice{border-left:3px solid var(--accent);padding:14px 16px;background:#0c1b2d;border-radius:0 12px 12px 0}.notice.good{border-color:var(--good)}.notice.warn{border-color:var(--warn)}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:20px 0}.step{padding:12px;border:1px solid var(--line);border-radius:12px;text-align:center;font-size:12px;color:var(--muted)}.step.on{border-color:var(--accent);color:#fff;background:#102941}.metric{font-size:34px;font-weight:900}.small{font-size:12px}.hidden{display:none}.footer{padding:45px 0 20px;color:var(--muted);font-size:12px;text-align:center}.heroSplit{display:grid;grid-template-columns:1.35fr .65fr;gap:18px;align-items:stretch}.scoreRing{display:grid;place-items:center;min-height:250px;background:radial-gradient(circle,#183653 0,#0b1728 58%,#09111d 100%);border:1px solid var(--line);border-radius:22px}.scoreRing .metric{font-size:58px}.list{display:grid;gap:10px}.listrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}input,textarea,select{width:100%;background:#081523;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}textarea{min-height:120px;resize:vertical}.choicegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{padding:14px;border:1px solid var(--line);border-radius:13px;background:#0b1a2b;cursor:pointer}.choice.sel{border-color:var(--accent);background:#12304a}.toast{position:fixed;right:18px;bottom:18px;background:#11263d;border:1px solid #31516e;padding:13px 16px;border-radius:12px;box-shadow:0 15px 50px #0008}
@media(max-width:900px){.shell,.heroSplit{grid-template-columns:1fr}.side{position:static}.grid,.kpis{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.app{padding:16px}.hero{padding-top:38px}.grid,.grid2,.kpis,.choicegrid{grid-template-columns:1fr}.timeline{grid-template-columns:1fr 1fr}.barrow{grid-template-columns:115px 1fr 35px}}
</style>
</head>
<body><div class="app">
<div class="top"><div class="brand">HIGH GROWTH LEADER™</div><div class="badge">V10 • COMMERCIAL VALIDATION EDITION</div></div>
<div id="app"></div>
<div class="footer">V10 validation prototype • Demo data only • No personal learner data is stored or transmitted</div>
</div>
<script>
const state={screen:'landing',q:0,answers:[],route:null,startedAt:null,lead:null,evidence:0};
const qs=[
{d:'Dependency',q:'When a critical business decision appears, who usually has to be involved?',o:['Me personally','Me plus a capable colleague','A defined owner using clear decision rights','The system/process resolves most cases']},
{d:'Ownership',q:'How confidently can your team make important decisions without you?',o:['Low confidence','Some confidence','High confidence','Very high — ownership is explicit']},
{d:'Systems',q:'How repeatable are your critical workflows?',o:['Mostly in my head','Some documented processes','Standardised and measured','Systemised, automated and governed']},
{d:'Transfer',q:'How is your expertise transferred to the next generation of leaders?',o:['Mostly through me','Coaching and informal documents','Structured playbooks and coaching','AI-enabled knowledge system with human review']},
{d:'Scale',q:'What is the biggest constraint on your next stage of growth?',o:['My capacity','Team capability','Operational consistency','Strategic scale and leverage']},
{d:'Continuity',q:'If you disappeared for 30 days, what would most likely happen?',o:['Performance would fall quickly','Some decisions would stall','The team would continue with minor friction','The business would largely operate normally']}
];
const modules=[
['01','From Performer to Multiplier','Shift from personal output to leadership leverage.'],
['02','The Dependency Trap','Identify where growth still depends on you.'],
['03','See Potential Before Performance','Spot and develop the next generation.'],
['04','Coach the Next Generation','Build capability rather than create dependency.'],
['05','Extract Your Expertise','Turn judgement into reusable organisational knowledge.'],
['06','Build a Team That Doesn’t Need You','Transfer ownership, decisions and standards.'],
['07','Become an AI-Powered Leader','Use AI without surrendering accountability.'],
['08','AI-Powered Knowledge Transfer','Build governed, reviewable knowledge workflows.'],
['09','Lead Beyond Your Organisation','Multiply influence beyond the immediate team.'],
['10','Build the Next Generation in Public','Create visible leadership evidence.'],
['11','Leadership Operating System','Integrate standards, decisions, rhythms and metrics.'],
['12','Step-Away Challenge™','Prove continuity under reduced founder dependency.']
];
function scores(){let s={Dependency:0,Ownership:0,Systems:0,Transfer:0,Scale:0,Continuity:0};state.answers.forEach((a,i)=>s[qs[i].d]=a+1);return s}
function route(){let s=scores();if(s.Systems>=3&&s.Transfer>=3||s.Dependency<=2&&s.Continuity<=2)return ['System Builder','Build a business that performs without constant founder intervention.',['Dependency Mapping','Expertise Extraction','Ownership Transfer','AI Knowledge Transfer','Leadership OS','Step-Away Challenge']];if(s.Ownership<=2||s.Dependency<=2)return ['Multiplier Leader','Turn your leadership capability into scalable team performance.',['Delegation','Coaching','Decision Rights','Standards','Leadership Multiplication','Scale']];return ['Strategic Leader','Move from operational leadership into enterprise-level leverage.',['Strategic Focus','Portfolio Thinking','Influence','Leadership Multiplication','Scale','Continuity']]}
function indexScore(){let s=scores();return Math.round(Object.values(s).reduce((a,b)=>a+b,0)/Object.values(s).length*20)}
function header(a,b){return '<div class="hero" style="padding-bottom:10px"><div class="eyebrow">'+a+'</div><h2>'+b+'</h2></div>'}
function toast(msg){let x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2400)}
function render(){const r=document.getElementById('app');let h='';
if(state.screen==='landing')h='<section class="heroSplit"><section class="hero"><div class="eyebrow">Adaptive leadership development system</div><h1>Stop being the bottleneck. Become the multiplier.</h1><p>High Growth Leader™ diagnoses the leadership constraint holding back your next stage of growth, builds a personalised development route and requires evidence that the change works in the real business.</p><div class="actions"><button class="btn" onclick="start()">Take the 6-minute assessment →</button><button class="btn secondary" onclick="show('review')">Preview the reviewer experience</button></div><div style="margin-top:25px"><span class="tag">Assessment-led</span><span class="tag">Pathway-personalised</span><span class="tag">Evidence-based</span><span class="tag">Demo Day certified</span></div></section><div class="scoreRing"><div style="text-align:center"><div class="eyebrow">The outcome</div><div class="metric">Leverage</div><p class="muted">Less dependency.<br>More ownership. Greater continuity.</p></div></div></section><div class="grid"><div class="card"><div class="eyebrow">01 Diagnose</div><h3>Find the constraint</h3><p class="muted">Six dimensions reveal where leadership leverage is being lost.</p></div><div class="card"><div class="eyebrow">02 Personalise</div><h3>Build the right route</h3><p class="muted">System Builder, Multiplier Leader or Strategic Leader — selected by evidence, not preference.</p></div><div class="card"><div class="eyebrow">03 Prove</div><h3>Demonstrate the change</h3><p class="muted">Evidence Portfolio → 30-day Step-Away Challenge™ → in-house Demo Day → certification.</p></div></div><div class="card" style="margin-top:14px"><div class="grid2"><div><h3>Why V10 is different</h3><p class="muted">Traditional leadership programmes measure completion. High Growth Leader™ measures whether leadership capacity has actually moved into the organisation.</p></div><div><h3>Designed for high-growth environments</h3><p class="muted">Every activity connects learning to a live business constraint, a named owner, a measurable change and a proof point.</p></div></div></div>';
else if(state.screen==='assessment'){let q=qs[state.q];h=header('High Growth Leadership Index™','Question '+(state.q+1)+' of '+qs.length)+'<div class="card"><div class="progress"><span style="width:'+(state.q/qs.length*100)+'%"></span></div><div class="question"><div class="tag">'+q.d+'</div><h3 style="font-size:24px;margin-top:12px">'+q.q+'</h3>'+q.o.map((x,i)=>'<button class="option '+(state.answers[state.q]===i?'sel':'')+'" onclick="answer('+i+')">'+x+'</button>').join('')+'</div></div><p class="muted small">Your answers create a baseline across Dependency, Ownership, Systems, Transfer, Scale and Continuity.</p>';
}else if(state.screen==='diagnosis'){state.route=route();let sc=scores(),idx=indexScore();h=header('Your diagnosis','Your leadership system is ready for a '+state.route[0]+' pathway.')+'<div class="heroSplit"><div><div class="notice good"><b>'+state.route[0]+' is your highest-leverage route.</b><br><span class="muted">'+state.route[1]+'</span></div><div class="card" style="margin-top:14px"><h3>Your adaptive sequence</h3>'+state.route[2].map((x,i)=>'<div class="listrow"><span><b>0'+(i+1)+'</b> &nbsp;'+x+'</span><span class="tag">Priority</span></div>').join('')+'</div></div><div class="scoreRing"><div style="text-align:center"><div class="eyebrow">Leadership Index</div><div class="metric">'+idx+'</div><span class="muted">/ 100 baseline</span></div></div></div><div class="actions"><button class="btn" onclick="show('onboard')">Build My Leadership System →</button></div>';
}else if(state.screen==='onboard')h=header('Welcome to your system','Before we build your route, define the outcome that matters.')+'<div class="grid2"><div class="card"><h3>Primary growth outcome</h3><p class="muted">What would make this programme commercially valuable for you?</p><div class="choicegrid" id="outcomes">'+['Reduce founder dependency','Build stronger leaders','Systemise operations','Scale strategically'].map((x,i)=>'<div class="choice" onclick="pickOutcome(this,'+i+')">'+x+'</div>').join('')+'</div></div><div class="card"><h3>Success metric</h3><p class="muted">Name the measurable change you want to see.</p><input id="metric" placeholder="e.g. reduce my operational involvement by 30%"><div class="actions"><button class="btn" onclick="saveOnboard()">Create my personalised dashboard →</button></div></div></div>';
else if(state.screen==='dashboard')h=dashboard();
else if(state.screen==='module'){renderModule();return;}
else if(state.screen==='academy')h=academy();
else if(state.screen==='evidence')h=evidence();
else if(state.screen==='challenge')h=challenge();
else if(state.screen==='demo')h=demo();
else if(state.screen==='certify')h=certify();
else if(state.screen==='review')h=review();
else if(state.screen==='pricing')h=pricing();
else if(state.screen==='lead')h=lead();
r.innerHTML=h}
function nav(){return '<aside class="side"><div class="brand" style="margin:8px 0 16px">MY SYSTEM</div>'+[['dashboard','Dashboard'],['academy','Academy'],['evidence','Evidence Portfolio'],['challenge','Step-Away Challenge'],['demo','Demo Day'],['certify','Certification']].map(x=>'<div class="nav '+(state.screen===x[0]?'active':'')+'" onclick="show(\''+x[0]+'\')">'+x[1]+'</div>').join('')+'<div class="nav" onclick="show(\'review\')">Reviewer View</div></aside>'}
function dashboard(){let sc=scores(),idx=indexScore(),rt=state.route||route();return '<div class="shell">'+nav()+'<main class="content"><div class="eyebrow">Personalised dashboard</div><h2 style="font-size:42px;margin:8px 0">'+rt[0]+' pathway</h2><p class="muted">Built around your assessed constraint. Your route adapts as evidence changes.</p><div class="kpis"><div class="card kpi">Leadership Index<b>'+idx+'/100</b><span class="muted">Baseline</span></div><div class="card kpi">Dependency<b>'+sc.Dependency+'/4</b><span class="muted">Lower is better</span></div><div class="card kpi">Ownership<b>'+sc.Ownership+'/4</b><span class="muted">Transfer priority</span></div><div class="card kpi">Continuity<b>'+sc.Continuity+'/4</b><span class="muted">Step-away readiness</span></div></div><div class="grid2" style="margin-top:14px"><div class="card"><div class="eyebrow">Next Best Action™</div><h3>Transfer one recurring decision</h3><p class="muted">Name the owner, define the decision boundary, establish escalation rules and test for seven days.</p><button class="btn" onclick="show('academy')">Open next module →</button></div><div class="card"><div class="eyebrow">Programme progress</div><h3>3 of 12 modules unlocked</h3><div class="progress"><span style="width:25%"></span></div><p class="muted">Your evidence unlocks the next layer of the programme.</p></div></div><div class="card" style="margin-top:14px"><h3>Your diagnostic profile</h3>'+Object.entries(sc).map(([k,v])=>'<div class="barrow"><span>'+k+'</span><div class="progress"><span style="width:'+(v/4*100)+'%"></span></div><b>'+v+'/4</b></div>').join('')+'</div></main></div>'}
function academy(){let rt=state.route||route();return '<div class="shell">'+nav()+'<main class="content">'+header('Academy','Your route — not a generic curriculum.')+'<div class="notice"><b>'+rt[0]+' depth is active.</b> Modules highlighted in your pathway receive deeper build tasks and evidence requirements.</div><div class="grid" style="margin-top:14px">'+modules.map((m,i)=>{let active=i<3||rt[2].some(x=>m[1].toLowerCase().includes(x.toLowerCase().split(' ')[0]));return '<div class="card" style="opacity:'+(active?1:.62)+'"><div class="eyebrow">'+m[0]+' • '+(active?'ACTIVE':'LOCKED')+'</div><h3>'+m[1]+'</h3><p class="muted">'+m[2]+'</p><button class="btn '+(active?'':'ghost')+'" onclick="module('+i+')">'+(active?'Open module':'Unlock with evidence')+'</button></div>'}).join('')+'</div></main></div>'}
function module(i){state.screen='module';state.module=i;renderModule()}
function renderModule(){let m=modules[state.module||4];document.getElementById('app').innerHTML=header('Module '+m[0],m[1])+'<div class="timeline"><div class="step on">Learn</div><div class="step on">Build</div><div class="step">Transfer</div><div class="step">Prove</div><div class="step">Certify</div><div class="step">Reassess</div></div><div class="grid2"><div class="card"><h3>Why this matters</h3><p class="muted">Leadership leverage grows when critical capability moves from the individual into the team and operating system.</p></div><div class="card"><h3>Build task</h3><p class="muted">Create a one-page artefact from a live business issue: trigger, inputs, decision rule, owner, exceptions and review point.</p></div></div><div class="card" style="margin-top:14px"><h3>Evidence gate</h3><p class="muted">Upload or record the artefact, name the business impact and identify what changed in your behaviour or the organisation.</p><textarea placeholder="Evidence note: what changed, what was measured, and what you learned?"></textarea><div class="actions"><button class="btn" onclick="completeModule()">Submit evidence →</button><button class="btn secondary" onclick="show('academy')">Back to Academy</button></div></div>'}
function evidence(){return '<div class="shell">'+nav()+'<main class="content">'+header('Evidence Portfolio','Proof, not attendance.')+'<div class="grid">'+[['✓','Dependency Map','Critical dependency identified and baseline recorded.'],['✓','Expertise-to-System Pack','Decision logic converted into reusable organisational knowledge.'],['✓','Ownership Matrix','Decision rights and escalation boundaries assigned.'],['✓','AI Workflow Card','Automation designed with human review.'],['○','Step-Away Results','30-day continuity evidence still required.'],['○','Demo Day','Live in-house proof of transfer and continuity.']].map(x=>'<div class="card"><div class="tag">'+x[0]+' EVIDENCE</div><h3>'+x[1]+'</h3><p class="muted">'+x[2]+'</p></div>').join('')+'</div><div class="card" style="margin-top:14px"><h3>Evidence quality standard</h3><p class="muted">Every artefact should show the baseline, intervention, owner, measurable change and reflection. Evidence is reviewed before certification.</p></div></main></div>'}
function challenge(){return '<div class="shell">'+nav()+'<main class="content">'+header('Step-Away Challenge™','Prove the organisation can operate with less dependence on you.')+'<div class="grid2"><div class="card"><h3>30-day experiment</h3><p class="muted">Choose one responsibility you currently own. Transfer it, establish the system, step back, measure the result and document exceptions.</p><div class="notice good"><b>Success threshold</b><br>Measurable dependency reduction + successful ownership transfer + continuity evidence.</div></div><div class="card"><h3>Challenge tracker</h3><div class="listrow"><span>Responsibility selected</span><span class="tag">READY</span></div><div class="listrow"><span>Owner nominated</span><span class="tag">READY</span></div><div class="listrow"><span>System defined</span><span class="tag">READY</span></div><div class="listrow"><span>30-day evidence</span><span class="pill">PENDING</span></div><div class="actions"><button class="btn" onclick="demo()">Submit challenge plan →</button></div></div></div></main></div>'}
function demo(){return '<div class="shell">'+nav()+'<main class="content">'+header('In-house Demo Day','Demonstrate the change you created.')+'<div class="card"><div class="tag">ASSESSMENT RUBRIC</div>'+[['Dependency reduced',25],['Ownership transferred',20],['Knowledge system',20],['Standards & decisions',15],['Continuity evidence',20]].map(x=>'<div class="barrow"><span>'+x[0]+'</span><div class="progress"><span style="width:'+x[1]+'%"></span></div><b>'+x[1]+'%</b></div>').join('')+'</div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Demo submission</h3><p class="muted">Present baseline → intervention → evidence → business impact → what happens without you.</p><button class="btn" onclick="toast(\'Demo submission recorded for review\')">Submit for review →</button></div><div class="card"><h3>Reviewer standard</h3><p class="muted">Evidence must be observable, attributable and linked to the assessed leadership constraint.</p></div></div></main></div>'}
function certify(){let rt=state.route||route();return '<div class="shell">'+nav()+'<main class="content">'+header('Certification','High Growth Leader™ — '+rt[0])+'<div class="heroSplit"><div class="card"><div class="tag">PATHWAY CERTIFICATION</div><h2 style="margin-top:12px">'+rt[0]+'</h2><p class="muted">Certification is awarded after assessment, pathway completion, evidence review, Step-Away Challenge™ and in-house Demo Day.</p><div class="notice good"><b>Certification gate status</b><br>Assessment ✓ &nbsp; Evidence ✓ &nbsp; Challenge ○ &nbsp; Demo Day ○</div></div><div class="scoreRing"><div style="text-align:center"><div class="eyebrow">Next</div><div class="metric">02</div><span class="muted">proof gates remaining</span></div></div></div><div class="actions"><button class="btn" onclick="show('challenge')">Continue to proof →</button><button class="btn secondary" onclick="start()">Reassess leadership →</button></div></main></div>'}
function review(){return header('Reviewer Experience','See what a first-time customer sees — then challenge the proposition.')+'<div class="grid"><div class="card"><div class="eyebrow">01 Concept</div><h3>Is the promise compelling?</h3><p class="muted">Does “stop being the bottleneck” clearly communicate the commercial outcome?</p></div><div class="card"><div class="eyebrow">02 Diagnosis</div><h3>Does the assessment feel meaningful?</h3><p class="muted">Would the six dimensions credibly diagnose a leadership constraint?</p></div><div class="card"><div class="eyebrow">03 Personalisation</div><h3>Does the route feel earned?</h3><p class="muted">Can you see why a learner gets System Builder, Multiplier or Strategic Leader?</p></div><div class="card"><div class="eyebrow">04 Evidence</div><h3>Would you trust the proof?</h3><p class="muted">Are evidence gates stronger than course completion certificates?</p></div><div class="card"><div class="eyebrow">05 Commercial</div><h3>Would you pay?</h3><p class="muted">What price, buyer and business case would make this an obvious decision?</p></div><div class="card"><div class="eyebrow">06 Missing</div><h3>What blocks purchase?</h3><p class="muted">Identify trust, credibility, implementation or product gaps.</p></div></div><div class="card" style="margin-top:14px"><h3>Reviewer feedback</h3><textarea id="feedback" placeholder="What would make you more likely to buy or recommend High Growth Leader™?"></textarea><div class="actions"><button class="btn" onclick="copyFeedback()">Copy feedback prompt →</button><button class="btn secondary" onclick="show('pricing')">View commercial model</button></div></div>'}
function pricing(){return header('Commercial model','A premium leadership system, not another content library.')+'<div class="grid"><div class="card"><div class="eyebrow">Individual</div><h3>Leadership Accelerator</h3><div class="metric">£1,500</div><p class="muted">Assessment, adaptive pathway, academy, evidence portfolio and certification.</p><button class="btn" onclick="show('lead')">Join validation cohort →</button></div><div class="card"><div class="eyebrow">Team</div><h3>Leadership Cohort</h3><div class="metric">£7,500</div><p class="muted">Up to 10 leaders, pathway diagnostics, facilitator review and in-house Demo Day.</p><button class="btn" onclick="show('lead')">Request cohort brief →</button></div><div class="card"><div class="eyebrow">Enterprise</div><h3>Leadership System</h3><div class="metric">Custom</div><p class="muted">Organisation-wide diagnostic, pathways, governance, reporting and leadership pipeline.</p><button class="btn" onclick="show('lead')">Start enterprise conversation →</button></div></div><p class="muted small" style="margin-top:14px">Prototype pricing for validation — not a live payment flow.</p>'}
function lead(){return header('Validation cohort','Turn the prototype into a measurable commercial pilot.')+'<div class="grid2"><div class="card"><h3>What happens next</h3><div class="listrow"><span>1. Discovery</span><span class="tag">30 min</span></div><div class="listrow"><span>2. Baseline assessment</span><span class="tag">Online</span></div><div class="listrow"><span>3. Adaptive pathway</span><span class="tag">Personalised</span></div><div class="listrow"><span>4. Evidence + Demo Day</span><span class="tag">Proof</span></div></div><div class="card"><h3>Request the pilot brief</h3><input id="name" placeholder="Name" style="margin-bottom:9px"><input id="email" placeholder="Work email" style="margin-bottom:9px"><input id="company" placeholder="Company / organisation"><div class="actions"><button class="btn" onclick="submitLead()">Request pilot brief →</button></div><p class="muted small">Prototype only: details are not transmitted or stored.</p></div></div>'}
function start(){state.screen='assessment';state.q=0;state.answers=[];state.route=null;state.startedAt=Date.now();render()}
function answer(i){state.answers[state.q]=i;if(state.q<qs.length-1){state.q++;render()}else{state.route=route();state.screen='diagnosis';render()}}
function show(s){state.screen=s;render()}
function pickOutcome(el,i){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');state.outcome=i}
function saveOnboard(){state.metric=document.getElementById('metric').value||'Reduce leadership dependency';state.screen='dashboard';render()}
function completeModule(){state.evidence++;toast('Evidence captured in your prototype portfolio');show('evidence')}
function copyFeedback(){let t=document.getElementById('feedback').value||'What would make you more likely to buy or recommend High Growth Leader™?';navigator.clipboard?.writeText(t);toast('Feedback prompt copied')}
function submitLead(){toast('Pilot request captured in prototype mode — no data was transmitted')}
render();
</script></body></html>
